# Публікує лише папку sheet/ (застосунок «Чистий аркуш») на GitHub Pages.
# Pages вмикається автоматично при першому запуску (enablement: true); вручну нічого вмикати не треба.
name: Deploy sheet to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['sheet/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # сам вмикає Pages (Source: GitHub Actions) при першому запуску
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sheet
      - id: deployment
        uses: actions/deploy-pages@v4
