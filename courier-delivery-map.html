.cr-toast{position:fixed;left:12px;right:12px;bottom:74px;max-width:496px;margin:0 auto;border-radius:10px;background:#111827;color:#fff;padding:11px 14px;text-align:center;font-size:13px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}.cr-toast.show{opacity:1}
.lp{font-size:11px;color:var(--muted);font-weight:700}.hint{font-size:11.5px;color:var(--muted);text-align:center}.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
.cr-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.cr-switch button{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:10px;font-weight:800;font-size:13.5px}
.cr-switch button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}

<body>
<div class="cr-app theme-light" id="app">

    <div class="cr-topbar__inner"><div class="cr-titleblock"><div class="cr-kicker" id="kicker"></div><h1>Розвезення</h1></div>
      <div class="cr-user"><select id="me"><option>Вася</option><option>Роман</option><option>Бухгалтер</option></select><button class="cr-themebtn" id="themebtn">☀</button></div></div>
    <div class="cr-switch" id="switch"><button data-s="pickup">📍 Точки видачі</button><button data-s="address">🗺️ Адресна</button></div>
  </header>
  <main class="cr-main" id="main">

    <div id="mapwrap" style="display:none"><div id="map"></div></div>

  </main>
  <nav class="cr-tabs" id="tabs">

    <button data-t="route"><span>🚚</span>Їде<b id="b-route" style="display:none"></b></button>
    <button data-t="delivered"><span>📦</span>Доставлено<b id="b-deliv" style="display:none"></b></button>
    <button data-t="reports"><span>📊</span>Звіти</button>
  </nav>
  <div class="cr-toast" id="toast"></div>
  <div class="cr-modal" id="cardModal" style="display:none"><button class="cr-shade" data-act="closeCard"></button><div class="cr-sheet" id="cardSheet"></div></div>
</div>

<script>

    {id:'a1',code:'ДН',name:'Тарас',phone:'+380500000001',clean:'вул. Приозерна, 12, 1 під.',dist:'Оболонь',lat:50.5125,lng:30.4980,fee:null,montage:false,com:'',st:'free',by:null,planned:false,hidden:false,pos:0,confirmed:false,paid:false},

    {id:'a5',code:'ДН',name:'Богдан',phone:'+380500000003',clean:'вул. Лісова, 14, 3 під.',dist:'Печерськ',lat:50.4270,lng:30.5390,fee:null,montage:false,com:'',st:'reserved',by:'Роман',planned:false,hidden:false,pos:1,confirmed:false,paid:false},

    {id:'a7',code:'ДМО',name:'Юрій',phone:'+380500000007',clean:'смт Демидів (за межами Києва)',dist:'приміська',lat:50.6200,lng:30.3600,fee:1200,montage:true,com:'',st:'free',by:null,out:true,planned:false,hidden:false,pos:0,confirmed:false,paid:false},
    {id:'a8',code:'ДН',name:'Галина',phone:'+380500000008',clean:'вул. Лугова, 5',dist:'Оболонь',lat:50.5180,lng:30.4900,fee:null,montage:false,com:'',st:'free',by:null,planned:false,hidden:false,pos:0,confirmed:false,paid:false},

  ];
  // Самовивіз — замовлення по точках видачі (спрощено для демо перемикача)
  var P=[
    {id:'p1',point:'Щербаківського 37 «Двері»',order:'k3980',name:'Олег',phone:'+380500000011',mesh:4,com:'',st:'free',by:null},
    {id:'p2',point:'Щербаківського 37 «Двері»',order:'*28780',name:'Артем',phone:'+380500000012',mesh:4,com:'бин, в1',st:'free',by:null},
    {id:'p3',point:'Борщагівська 171/18 «Питна Вода»',order:'i70787',name:'Олег Денисюк',phone:'+380500000013',mesh:3,com:'',st:'loaded',by:'Вася'},
    {id:'p4',point:'Борщагівська 171/18 «Питна Вода»',order:'i70739',name:'Вячеслав',phone:'+380500000014',mesh:2,com:'до 17:00',st:'free',by:null},
    {id:'p5',point:'Миропільська 53-А «Юність»',order:'i70871',name:'Ніна',phone:'+380500000015',mesh:1,com:'',st:'delivered',by:'Вася'},
    {id:'p6',point:'Миропільська 53-А «Юність»',order:'i70844',name:'Богдан',phone:'+380500000016',mesh:2,com:'',st:'free',by:null},
  ];
  var me='Вася',section='address',tab='cex',theme='light',hours=3,period='trip',cexView='common',dragId=null,cardId=null;
  var THEMES=['light','dark','warm'],TICON={light:'☀',dark:'🌙',warm:'♨'};
  var col={free:'#4f46e5',planned:'#4f46e5',reserved:'#7c5cff',star:'#0f9f6e',lock:'#8a8f88',loaded:'#0f9f6e',delivered:'#0b86b8',depot:'#172018',out:'#c93636'};
  var distOrder=['Оболонь','Поділ',"Солом'янка",'Печерськ','Лівобережжя','приміська'];
  var $=function(s){return document.querySelector(s);};var byId=function(id){return A.concat(P).find(function(x){return x.id===id;});};
  function isPickup(o){return o&&o.point!==undefined;}
  var map,layer,lastKey='';
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2300);}
  function mine(o){return o.by===me;}function isUs(o){return o.code==='ДО'||o.code==='ДМО';}function canManage(){return me==='Роман'||me==='Бухгалтер';}
  function byPos(a,b){return (a.pos||999)-(b.pos||999);}
  function myActive(){return A.filter(function(o){return o.by===me&&(o.planned||o.st==='reserved'||o.st==='loaded');});}
  function renumber(){myActive().sort(byPos).forEach(function(o,i){o.pos=i+1;});}
  function nextPos(){var m=0;myActive().forEach(function(o){if(o.pos>m)m=o.pos;});return m+1;}
  function myPlan(){return A.filter(function(o){return o.by===me&&(o.planned||o.st==='reserved')&&o.st!=='loaded'&&o.st!=='delivered';}).sort(byPos);}
  function myRoute(){return A.filter(function(o){return o.by===me&&o.st==='loaded';}).sort(byPos);}

  function ensureMap(){if(map)return;map=L.map('map',{zoomControl:true}).setView([50.455,30.50],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);layer=L.layerGroup().addTo(map);}
  function mColor(o){if(o.geo==='pin'&&o.lat==null)return null;if(o.st==='reserved')return mine(o)?col.star:col.lock;if(o.st==='loaded')return col.loaded;if(o.st==='delivered')return col.delivered;return o.planned?col.planned:(o.out?col.out:col.free);}
  function drawMap(items,numbered,line,key){
    ensureMap();layer.clearLayers();
    L.marker([DEPOT.lat,DEPOT.lng],{icon:L.divIcon({className:'',html:'<span class="mk" style="background:'+col.depot+'">⌂</span>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(layer).bindTooltip(DEPOT.name);
    var pts=[[DEPOT.lat,DEPOT.lng]];

      var m=L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:'<span class="mk" style="background:'+c+'">'+l+'</span>',iconSize:[26,26],iconAnchor:[13,13]}),draggable:o.pinning===true}).addTo(layer);

    });

  function cardActions(o){var b=[];

    else if(o.st==='reserved'&&!mine(o)){if(canManage())b.push(['release','⟲ Звільнити резерв ('+o.by+')','rm']);else b.push(['none','🔒 Зайнято: '+o.by,'']);}

    [].forEach.call($('#tabs').children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===tab);});
    var r=pickup?renderPickup():renderAddress();
    $('#summary').innerHTML=r.sum;$('#panel').innerHTML=r.panel;$('#subseg').innerHTML=r.sub;$('#routebar').innerHTML=r.rb;$('#list').innerHTML=r.list;$('#extra').innerHTML=r.extra;
    if(r.showMap){$('#mapwrap').style.display='block';drawMap(r.mapItems,r.numbered,r.line,tab+'/'+cexView);}else $('#mapwrap').style.display='none';
    if(pickup){setB('b-cex',P.filter(function(o){return o.st==='free';}).length);setB('b-route',P.filter(function(o){return o.by===me&&o.st==='loaded';}).length);setB('b-deliv',P.filter(function(o){return o.by===me&&o.st==='delivered';}).length);}
    else{setB('b-cex',A.filter(function(o){return o.st==='free'&&!o.planned;}).length);setB('b-route',myRoute().length);setB('b-deliv',A.filter(function(o){return o.by===me&&o.st==='delivered';}).length);}
  }
  function setB(id,n){var e=document.getElementById(id);e.textContent=n;e.style.display=n?'block':'none';}

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');
    if(el){var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
      if(a==='closeCard'){closeCard();return;}
      if(a==='cv'){cexView=el.getAttribute('data-v');render();return;}
      if(a==='up'){reorder(id,-1);return;}if(a==='down'){reorder(id,1);return;}
      if(a==='aiplan'){aiPlan();return;}
      if(a==='period'){period=el.getAttribute('data-p');render();return;}
      if(a==='confirm'){var c=el.getAttribute('data-c');A.forEach(function(o){if(o.by===c&&o.st==='delivered'&&isUs(o))o.confirmed=true;});toast('Підтверджено: '+c);render();return;}
      if(a==='pay'){var cp=el.getAttribute('data-c');A.forEach(function(o){if(o.by===cp&&o.st==='delivered'&&isUs(o)&&o.confirmed)o.paid=true;});toast('Оплачено: '+cp);render();return;}
      if(a==='none')return;
      doAct(a,id);return;
    }
    var rowEl=e.target.closest('[data-card]');if(rowEl){var o=byId(rowEl.getAttribute('data-card'));if(o.st==='reserved'&&!mine(o)&&!canManage()){toast('Зайнято: '+o.by);return;}openCard(rowEl.getAttribute('data-card'));}
  });
  $('#main').addEventListener('input',function(e){var el=e.target;if(!el.getAttribute||el.getAttribute('data-act')!=='hours')return;hours=+el.value;var b=el.parentNode&&el.parentNode.querySelector('b');if(b)b.textContent=hours+' год';var pb=$('#panel').querySelector('[data-act=aiplan]');if(pb)pb.textContent='AI-план на '+hours+' год';});
  $('#main').addEventListener('dragstart',function(e){var el=e.target.closest('[data-drag]');if(el){dragId=el.getAttribute('data-drag');e.dataTransfer.effectAllowed='move';}});
  $('#main').addEventListener('dragover',function(e){var el=e.target.closest('[data-card]');if(el&&dragId){e.preventDefault();el.classList.add('drag-over');}});
  $('#main').addEventListener('dragleave',function(e){var el=e.target.closest('[data-card]');if(el)el.classList.remove('drag-over');});
  $('#main').addEventListener('drop',function(e){var el=e.target.closest('[data-card]');if(el&&dragId){e.preventDefault();dropReorder(dragId,el.getAttribute('data-card'));dragId=null;}});
  $('#me').onchange=function(e){me=e.target.value;cexView='common';renumber();render();toast('Тепер ви: '+me);};
  $('#themebtn').onclick=function(){theme=THEMES[(THEMES.indexOf(theme)+1)%3];$('#app').className='cr-app theme-'+theme;$('#themebtn').textContent=TICON[theme];setTimeout(function(){map&&map.invalidateSize();},60);};
  [].forEach.call($('#tabs').children,function(b){b.onclick=function(){tab=b.getAttribute('data-t');render();};});
  [].forEach.call($('#switch').children,function(b){b.onclick=function(){section=b.getAttribute('data-s');tab='cex';cexView='common';closeCard();render();};});
  renumber();render();
})();
</script>
</body>
</html>
